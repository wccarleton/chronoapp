[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronologer-app"
version = "0.1.0-beta.1"
description = "Chronologer application"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["chronologer>=0.2.0", "pymc>=6.3.2,<7", "arviz>=1.3,<2", "matplotlib>=3.8", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chronologer-app = "chronologer_app.main:run"

[tool.setuptools.packages.find]
where = ["src"]
